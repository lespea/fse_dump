name: Release

permissions:
  contents: read

on:
  push:
    tags: [v*]

# No rust-cache in this workflow: caches are writable by ordinary pushes, so restoring one here
# could leak into the shipped binaries and the crates.io publish

jobs:
  build_and_release:
    name: Build and Release
    runs-on: ${{ matrix.os }}
    environment: release

    permissions:
      contents: write # upload release assets

    strategy:
      # Don't let one failing target cancel the others mid-upload
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            ext: ".exe"
            oname: ""
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            ext: ""
            oname: "-linux"
          - os: macos-15-intel
            target: x86_64-apple-darwin
            ext: ""
            oname: "-darwin"
          - os: macos-latest
            target: aarch64-apple-darwin
            ext: ""
            oname: "-darwin_arm64"

    steps:
      - name: install musl tools
        if: ${{ matrix.target == 'x86_64-unknown-linux-musl' }}
        run: |
          sudo apt-get update
          sudo apt-get install -y musl musl-dev musl-tools

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        name: checkout
        with:
          fetch-depth: 1
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        name: toolchain
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      - name: test
        run: cargo test --target ${{ matrix.target }} --verbose --release

      - name: build
        run: cargo build --target ${{ matrix.target }} --verbose --release

      - uses: svenstaro/upload-release-action@29e53e917877a24fad85510ded594ab3c9ca12de # 2.11.5
        name: Upload binaries to release
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          tag: ${{ github.ref }}
          file: target/${{ matrix.target }}/release/fse_dump${{ matrix.ext }}
          asset_name: fse_dump-${{ github.ref_name }}${{ matrix.oname }}${{ matrix.ext }}

  publish:
    name: Publish
    needs: build_and_release
    runs-on: ubuntu-latest
    environment: release

    permissions:
      contents: read
      id-token: write # Required for OIDC token exchange

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: stable
      - uses: rust-lang/crates-io-auth-action@3268eb413133e2960fa4ae0e963ca76380c54cd9 # v1.0.6
        id: auth
      - run: cargo publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
