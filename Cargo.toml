[package]
name = "fse_dump"
description = "Dumps the fseventsd entries from a mac"

version = "3.2.1"
edition = "2024"

authors = ["Adam Lesperance <lespea@gmail.com>"]
categories = ["os::macos-apis", "command-line-utilities"]
keywords = ["mac", "fseventsd", "security", "forensics"]

license = "MIT OR Apache-2.0"
readme = "README.md"

homepage = "https://github.com/lespea/fse_dump"
repository = "https://github.com/lespea/fse_dump"

[badges]
maintenance = { status = "actively-developed" }

[features]
default = ["hex", "extra_id", "watch", "zstd"]

alt_flags = []
extra_id = []

hex = ["dep:serde-hex"]
watch = ["dep:crossbeam-channel", "dep:ctrlc", "dep:notify", "dep:notify-debouncer-full"]
zstd = ["dep:zstd"]

[dependencies]
bus = "2"
byteorder = "1"
clap = { features = ["derive"], version = "4" }
clap_complete = "4"
color-eyre = { default-features = false, version = "0" }
crossbeam-channel = { optional = true, version = "0" }
csv = "1"
ctrlc = { features = ["termination"], optional = true, version = "3" }
env_logger = "0"
flate2 = { default-features = false, features = ["zlib-rs"], version = "1" }
hashbrown = "0"
jiff = "0"
log = { features = ["max_level_debug", "release_max_level_info"], version = "0" }
mimalloc = { features = ["secure"], version = "0" }
notify = { default-features = false, features = ["macos_kqueue"], optional = true, version = "8" }
notify-debouncer-full = { optional = true, version = "0" }
regex = "1"
serde = { features = ["rc"], version = "1" }
serde-hex = { optional = true, version = "0" }
serde_derive = "1"
serde_json = "1"
serde_yaml_ng = "0"
walkdir = "2"
zstd = { features = ["zstdmt"], optional = true, version = "0" }

[profile.dev]
opt-level = 1

[profile.release]
codegen-units = 1
incremental = false
lto = true
strip = true
